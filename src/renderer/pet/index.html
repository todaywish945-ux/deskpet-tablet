<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>敲敲</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- Live2D 渲染后端三件套（顺序铁律：cubismcore → pixi → lipsyncpatch）；
         非 Live2D 皮肤时只是多加载三个全局脚本，无副作用 -->
    <script src="petasset://assets/vendor/live2dcubismcore.min.js"></script>
    <script src="petasset://assets/vendor/pixi.min.js"></script>
    <script src="petasset://assets/vendor/index.min.js"></script>
  </head>
  <body>
    <div id="tablet">
      <div class="camera" title=""></div>
      <div id="screen">
        <!-- 壁纸随皮肤：main.ts applySkin() 设 src（无壁纸的皮肤整张隐藏） -->
        <img id="wallpaper" alt="" draggable="false" />
        <div id="char-layer"></div>

        <!-- 主界面：Knock Knock 应用（头条 + 联系人栏 + 聊天窗） -->
        <div id="home-view" class="view">
          <div id="kk-header">
            <img class="kk-logo" src="petasset://assets/icons/knock-knock.svg" alt="" draggable="false" />
            <span>Knock Knock</span>
          </div>
          <div id="kk-body">
            <aside id="home-side">
              <!-- 顶部三键选项卡（游戏敲敲：邀约/私信/群聊；图标来自 ZZZ-Chat 描的游戏 glyph，
                   邀约是白色 glyph、私信/群聊是黑色——靠 invert 在暗底/黄底间切换可见性） -->
              <div id="kk-tabs">
                <button id="tab-video" class="tab" type="button" title="邀约视频通话">
                  <img src="petasset://assets/icons/tab-invite.png" alt="" draggable="false" />
                </button>
                <button id="tab-chat" class="tab on" type="button" title="私信">
                  <img src="petasset://assets/icons/tab-dm.png" alt="" draggable="false" />
                </button>
                <button id="tab-group" class="tab" type="button" title="群聊">
                  <img src="petasset://assets/icons/tab-group.png" alt="" draggable="false" />
                </button>
              </div>

              <!-- 邀约页侧栏：联系人（在线状态）：一张卡一个角色，点击切换 -->
              <div id="side-video" class="hidden">
                <div class="side-label">联系人</div>
                <div id="contact-cards"></div>
                <div class="side-divider"><i></i><span>Info</span><i></i></div>
                <div id="side-info">
                  发起邀约后她会以视频通话的形式接通
                </div>
              </div>

              <!-- 私信页侧栏：角色分组树（智谱项目→任务式：角色行下拉直接挂会话） -->
              <div id="side-chat">
                <div class="side-divider"><i></i><span>Choose</span><i></i></div>
                <div class="side-label-row">
                  <span class="side-label">Messaging</span>
                  <button id="manage-sessions-btn" type="button">管理</button>
                </div>
                <div id="batch-bar" class="hidden">
                  <button id="batch-select-all" type="button">全选</button>
                  <button id="batch-delete" type="button" disabled>删除所选</button>
                  <button id="batch-cancel" type="button">完成</button>
                </div>
                <!-- 角色分组树：renderSessions 按 characterId 每个角色生成一张组头，会话行挂在各自组头下 -->
                <div id="session-list"></div>
              </div>

              <!-- 群聊页侧栏：空槽位（游戏同款 NoData/Empty） -->
              <div id="side-group" class="hidden">
                <div class="side-label">群聊</div>
                <div class="group-slot"><span class="no-x">⊗</span><div class="no-meta"><div class="no-t">NoData</div><div class="no-s">Empty</div></div></div>
                <div class="group-slot"><span class="no-x">⊗</span><div class="no-meta"><div class="no-t">NoData</div><div class="no-s">Empty</div></div></div>
                <div class="group-slot"><span class="no-x">⊗</span><div class="no-meta"><div class="no-t">NoData</div><div class="no-s">Empty</div></div></div>
              </div>

              <button id="settings-btn" type="button" title="设置">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 000-2l2.1-1.6a.5.5 0 00.1-.7l-2-3.4a.5.5 0 00-.6-.2l-2.5 1a7.6 7.6 0 00-1.7-1l-.4-2.6a.5.5 0 00-.5-.5h-4a.5.5 0 00-.5.4l-.4 2.6a7.6 7.6 0 00-1.7 1l-2.5-1a.5.5 0 00-.6.2l-2 3.4a.5.5 0 00.1.6L4.6 11a7.5 7.5 0 000 2l-2.1 1.6a.5.5 0 00-.1.7l2 3.4c.1.2.4.3.6.2l2.5-1a7.6 7.6 0 001.7 1l.4 2.6c0 .3.3.5.5.5h4c.2 0 .5-.2.5-.4l.4-2.6a7.6 7.6 0 001.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 00-.1-.7L19.4 13zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg>
                <span>设置</span>
              </button>
            </aside>
            <div id="home-main">
              <!-- 聊天窗：常驻（ZZZ-Chat 式空态），直接打字聊（视频通话在邀约页和窗口按钮） -->
              <div id="session-view">
                <div id="session-head">
                  <img id="session-char-avatar" class="head-avatar" src="petasset://skin/avatar.png" alt="" draggable="false" />
                  <span id="session-char-name" class="head-char"></span>
                  <span id="session-title"></span>
                  <span id="session-when"></span>
                </div>
                <div id="session-preview"></div>
                <form id="home-inputbar">
                  <input id="home-chat-input" type="text" placeholder="Type a message…" autocomplete="off" maxlength="2000" />
                  <button id="home-call-btn" type="button" title="视频通话">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 3.5v-10l-4 3.5z"/></svg>
                  </button>
                  <button id="home-send-btn" type="submit" title="发送">➤</button>
                </form>
              </div>
              <!-- 邀约页（游戏敲敲「邀约」同款）：角色卡 + 邀约按钮 = 发起视频通话 -->
              <div id="invite-view" class="hidden">
                <div id="invite-card">
                  <div class="invite-band"></div>
                  <img id="invite-avatar" src="petasset://skin/avatar.png" alt="" draggable="false" />
                  <div id="invite-nameplate"><span id="invite-name">叶瞬光</span><span class="face-icon">☺</span></div>
                  <div id="invite-impression">
                    <div class="imp-title" id="imp-title">对叶瞬光的印象：</div>
                    <div class="imp-text" id="imp-text">聊得多了，这里就会写下对你的印象</div>
                  </div>
                  <div id="invite-topic">
                    <div class="it-label">今天想聊点什么？</div>
                    <div id="topic-chips">
                      <button class="chip" type="button">随便聊聊</button>
                      <button class="chip" type="button">最近有点焦虑</button>
                      <button class="chip" type="button">今天发生的事</button>
                      <button class="chip" type="button">心事想找人说说</button>
                      <button class="chip" type="button">帮我放松一下</button>
                      <button class="chip" type="button">睡不着，想聊天</button>
                    </div>
                    <input id="topic-input" type="text" placeholder="想聊什么，直接写下来…（回车邀约）" autocomplete="off" />
                  </div>
                  <div class="invite-actions">
                    <button id="invite-btn" type="button">邀约</button>
                    <button id="invite-star" class="invite-star" type="button" title="喜欢这位代理人" aria-pressed="false">★</button>
                  </div>
                </div>
              </div>

              <!-- 群聊页（游戏「群聊」同款空态） -->
              <div id="group-view" class="hidden">
                <div id="group-head">
                  <svg class="head-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 11a3 3 0 110-6 3 3 0 010 6zM3 18.4c.5-2.9 2.7-4.6 5.5-4.6 1.4 0 2.7.4 3.7 1.2-1.3 1-2.1 2.2-2.4 3.9L9.6 20H3.4L3 18.4zM16.5 11.6a2.6 2.6 0 110-5.2 2.6 2.6 0 010 5.2zm-3.2 8.4l.2-1.3c.4-2.3 2.1-3.7 4.5-3.7 2 0 3.6 1 4.2 2.9l.4 1.2h-9.3z"/></svg>
                  <span>群聊</span>
                </div>
                <div id="group-empty">群聊功能筹备中——以后可以拉多个角色进同一间屋子</div>
              </div>

              <!-- 档案记忆面板：她长期记住的关于你的事 -->
              <div id="profile-panel" class="hidden">
                <div id="profile-head">
                  <span class="ph-title">她记住的关于你<span id="profile-count" class="hidden"></span></span>
                  <button id="profile-close" type="button" title="关闭">×</button>
                </div>
                <div id="profile-list"></div>
                <div id="profile-tip">每场通话结束后她会自己回忆整理；不想让她记的可以删掉。</div>
              </div>
            </div>
          </div>
        </div>

        <div id="win-controls">
          <button id="win-min" type="button" title="最小化">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          </button>
          <button id="win-max" type="button" title="最大化/还原">
            <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          </button>
          <button id="win-close" type="button" title="退出" class="close">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          </button>
        </div>

        <!-- 通话界面 -->
        <div id="call-view" class="view hidden">
          <div id="statusbar">
            <div class="left">
              <span class="dot"></span>
              <span class="name">叶瞬光</span>
            </div>
            <div class="right">
              <span id="waveform" class="waveform"><i></i><i></i><i></i><i></i></span>
              <span id="call-label">视频通话中</span>
              <button id="history-toggle" type="button" title="聊天记录">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
              </button>
            </div>
          </div>

          <div id="chat-area">
            <!-- 时间顺序：我发的在上，她的回复在下（行序即上下序，别调换） -->
            <div id="toast-row" class="msg-row me hidden">
              <span class="kk-avatar kk-avatar-user"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5z"/></svg></span>
              <div id="user-toast" class="hidden"></div>
            </div>
            <!-- 敲敲式消息行：头像 + 气泡（隐藏类挂在行上，头像随气泡一起显隐） -->
            <div id="bubble-row" class="msg-row her hidden">
              <img id="bubble-avatar" class="kk-avatar" alt="" draggable="false" />
              <div id="bubble" class="hidden"><span id="bubble-text"></span></div>
            </div>
          </div>

          <div id="call-bar">
            <form id="inputbar">
              <input id="chat-input" type="text" placeholder="跟瞬光说点什么…" autocomplete="off" maxlength="2000" />
              <button id="send-btn" type="submit" title="发送">➤</button>
            </form>
            <button id="hangup-btn" class="call-icon" type="button" title="挂断">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
          </div>

          <aside id="history-panel">
            <div class="panel-head">
              <span class="panel-title">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12.0016C2.0005 9.80922 2.72148 7.67774 4.05198 5.93522C5.38249 4.19269 7.24877 2.9357 9.3636 2.3577C11.4784 1.77969 13.7246 1.91271 15.7565 2.73628C17.7883 3.55984 19.4932 5.02831 20.6087 6.91569C21.7243 8.80307 22.1886 11.0047 21.9304 13.1819C21.6721 15.359 20.7055 17.391 19.1794 18.965C17.6533 20.539 15.6521 21.5678 13.484 21.8932C11.3159 22.2185 9.10092 21.8224 7.18 20.7656L3.292 21.9496C3.11858 22.0024 2.93407 22.0071 2.75819 21.9632C2.58231 21.9192 2.42168 21.8283 2.2935 21.7001C2.16531 21.5719 2.07438 21.4113 2.03043 21.2354C1.98648 21.0596 1.99117 20.875 2.044 20.7016L3.228 16.8076C2.42153 15.3342 1.9992 13.6813 2 12.0016Z" opacity=".55"/></svg>
                <span>聊天记录</span>
              </span>
              <button id="history-close" type="button" title="收起">×</button>
            </div>
            <div id="history-list"></div>
          </aside>
        </div>
      </div>
      <div id="grip-top" data-drag="1"></div>
      <div id="grip-left" data-drag="1"></div>
      <div id="grip-right" data-drag="1"></div>
      <div id="grip-bottom" data-drag="1"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
